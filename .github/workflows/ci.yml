name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: "package.json"
          check-latest: true
          cache: "pnpm"
      - run: make install
      - run: make setup
      - run: make lint
      - run: make tsc
      - run: make test
